name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # El SDK de Android ya viene instalado en GitHub; solo aceptamos las licencias
      - name: Licencias de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Preparar la web de la app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Clave de firma (para que cada versión se instale encima de la anterior)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/temvra-release.keystore
            printf "storeFile=temvra-release.keystore\nstorePassword=%s\nkeyAlias=vuelta\nkeyPassword=%s\n" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/keystore.properties
          else
            echo "::warning::Sin la clave de firma: el APK se firma con una clave temporal y no se podrá instalar encima de la versión anterior."
          fi

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Renombrar APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Temvra-Personal-1.0.${{ github.run_number }}.apk"

      # Si falla, se publica igualmente el APK
      - name: Compilar la app de PC
        continue-on-error: true
        working-directory: desktop
        run: |
          npm ci
          npm run appimage -- -c.extraMetadata.version=1.0.${{ github.run_number }}
          cp dist/*.AppImage "../out/Temvra-Personal-1.0.${{ github.run_number }}.AppImage"

      - uses: actions/upload-artifact@v5
        with:
          name: Temvra-Personal
          path: out/*

      - name: Publicar versión para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Temvra Personal 1.0.${{ github.run_number }}
          body: |
            **Móvil:** descarga el archivo .apk de abajo desde el móvil e instálalo. Se instala encima de la versión anterior sin perder tus datos.
            **PC (Windows):** descarga el archivo .exe y ejecútalo. Windows avisará de que la app no está firmada: pulsa «Más información» y «Ejecutar de todos modos».
            **PC (Linux):** descarga el archivo .AppImage, dale permiso de ejecución y ábrelo.
          files: out/*
          make_latest: true

  # Va aparte porque el instalador de Windows se compila en Windows. Si falla, el APK y el AppImage ya están publicados
  windows:
    needs: apk
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Preparar la web de la app
        run: |
          npm ci
          npm run build

      - name: Compilar la app de Windows
        working-directory: desktop
        run: |
          npm ci
          npm run win -- -c.extraMetadata.version=1.0.${{ github.run_number }}

      - name: Añadirla a la versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: desktop/dist/*.exe
