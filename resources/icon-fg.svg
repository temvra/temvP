<defs><path id="drop" d="M512 190 C 690 190 790 330 790 500 C 790 690 660 820 512 820 C 364 820 234 690 234 500 C 234 330 334 190 512 190 Z"/></defs>
<use href="#drop" fill="url(#d)"/>
